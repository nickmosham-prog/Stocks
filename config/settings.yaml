# Stock Volume & Alpha Dashboard - configuration
# Edit these values and restart `python main.py` to apply changes.

app:
  host: "127.0.0.1"
  port: 8000
  timezone: "America/New_York"
  db_path: "data/stocks.db"
  log_path: "logs/stocks.log"
  log_level: "INFO"

# How often (minutes) each scan loop runs during its active window.
schedule:
  premarket_scan_minutes: 5
  premarket_window_start: "07:00"
  premarket_window_end: "09:30"
  intraday_scan_minutes: 5
  intraday_window_start: "09:30"
  intraday_window_end: "16:00"
  eod_refresh_time: "16:30"
  # Fundamentals (P/E, earnings, revenue growth) barely change intraday, so
  # they're refreshed once a day, separately from the volume/OHLC refresh
  # above - kept 30 min later to avoid both jobs hitting the database at once.
  fundamentals_refresh_time: "17:00"

# Historical lookback used to build the "normal volume for this time of day"
# baseline that RVOL is measured against.
volume_profile:
  lookback_days: 20
  bucket_minutes: 5

# How many tickers (ranked by cheap RVOL+breakout score) get the more
# expensive per-ticker options + news enrichment each cycle.
enrichment:
  top_n: 30
  news_cache_minutes: 30
  options_cache_minutes: 15
  max_workers: 5
  max_retries: 3
  retry_backoff_seconds: 2

# Batch size for bulk price/volume pulls (yfinance multi-ticker download).
data_fetch:
  batch_size: 50

# Scoring weights and caps. Alpha score is a weighted blend of the
# component scores below, renormalized when a component is unavailable
# (e.g. a ticker with no listed options).
scoring:
  alpha_weights:
    rvol: 0.40
    breakout: 0.35
    options: 0.25
  rvol:
    cap: 5.0
  breakout:
    gap_cap_pct: 5.0
    range_cap_atr_multiple: 1.5
    level_cap_pct: 2.0
    # How long a break above/below the prior day's high/low must hold
    # (in consecutive scan cycles, roughly this many minutes) before the
    # dashboard marks it "confirmed" instead of just a fresh trigger. A
    # single instantaneous cross is easy to fake out; holding for a while
    # is a stronger signal.
    hold_confirm_minutes: 15
    weights:
      gap: 0.40
      range: 0.35
      level: 0.25
  options:
    vol_oi_cap: 5.0
    skew_cap_ln: 1.0986122886681098  # ln(3)
    min_contract_volume: 100
    weights:
      vol_oi: 0.70
      skew: 0.30

  # "Real financials, not just narratives" - a quality gate on the BUY
  # Setup signal below (alerts.buy_setup.require_fundamentals). A ticker
  # must be profitable, not wildly overvalued, and growing revenue
  # year-over-year. Missing data counts as "unknown", never as a pass -
  # see app/scan/fundamentals.py. Does not apply to the bearish
  # breakdown_setup tier (a bad-fundamentals company is exactly what a
  # bearish thesis often looks like, not a disqualifier).
  fundamentals:
    require_positive_earnings: true
    require_pe_in_range: true
    min_pe: 0        # effectively disabled by default (profitability already excludes negative-PE distress)
    max_pe: 60       # "not wildly overvalued" - raise this for growth-heavy watchlists
    require_revenue_growth: true
    refresh_hours: 24   # minimum age before a symbol's fundamentals count as stale

  # Options trade recommendation engine: for a ticker meeting BUY Setup
  # (call) or breakdown_setup (put) criteria, pick one specific contract
  # using real Black-Scholes Greeks (app/scan/options_greeks.py). Targets
  # a standard theta-mitigation convention - 30-45 days to expiration
  # (avoids the steepest final-2-weeks decay) and a moderately
  # in-the-money delta (real directional exposure without deep-OTM decay).
  # This is a heuristic contract selector, not a pricing guarantee.
  options_strategy:
    enabled: true
    dte_min: 30
    dte_max: 45
    target_delta_call: 0.65
    target_delta_put: -0.65
    delta_band: 0.10          # +/- around target: calls 0.55-0.75, puts -0.75 to -0.55
    risk_free_rate: 0.045     # approximation only - not precise, this is a heuristic filter
    min_open_interest: 50
    min_volume: 10

# Top Picks: a ranked list of the best bullish swing-trade ideas (days to
# weeks) with plain-English reasons, risks, and a suggested call option -
# the main "what should I look at buying" output. See app/scan/picks.py.
# A stock is only eligible if it passes the fundamentals check above, is
# above its 50-day average, and is up on the day; eligible stocks are then
# ranked by the weighted Pick Score (0-100). Shown on the dashboard's Top
# Picks tab (updated every scan) and emailed at `digest_times` (ET, Mon-Fri).
picks:
  enabled: true
  count: 5                 # picks per digest; fewer are sent on a weak day
  min_score: 55            # Pick Score floor - raise for fewer, stronger picks
  daily_history_days: 400  # calendar days of daily bars kept (covers the 200-day average + 52-week high)
  digest_times: ["10:00", "15:00"]
  max_extension_above_sma50_pct: 15   # flagged as a risk (not excluded) above this
  weights:
    trend: 0.30      # above 50/200-day averages, near 52-week high, beating the S&P 500
    momentum: 0.25   # up today on above-normal volume, breaking yesterday's high
    quality: 0.25    # revenue growth, profit margin, reasonable P/E
    analyst: 0.10    # upside to analysts' average price target, consensus rating
    options: 0.10    # call volume vs put volume (bullish options positioning)

# Email alerts. Per-scan tiers: a general heads-up when Alpha Score crosses
# `alpha_score_threshold`, and a stricter "BUY Setup" tier (buy_setup: below)
# for a stronger combined signal. Both use the same Gmail "App Password"
# (Google Account -> Security -> 2-Step Verification -> App passwords),
# NOT your real Gmail password. Leave app_password blank/CHANGE_ME to
# disable both without touching `enabled`.
alerts:
  enabled: true
  alpha_score_threshold: 80
  cooldown_minutes: 60   # don't re-alert the same symbol more often than this

  # Stricter second tier: fires a separate "BUY Setup" email only when a
  # ticker clears a higher Alpha Score bar AND its breakout has actually
  # held (see scoring.breakout.hold_confirm_minutes above), not just
  # triggered once. Runs alongside the alert above, doesn't replace it.
  # Screening only, same as everything else here - not a trade instruction.
  buy_setup:
    enabled: true
    alpha_score_threshold: 88
    require_bullish_direction: true
    require_confirmed_breakout: true
    require_fundamentals: true   # additional gate: see scoring.fundamentals above
    cooldown_minutes: 60

  # Bearish mirror of buy_setup - same technical checks, opposite
  # direction, no fundamentals gate. Drives the red "BREAKDOWN" badge on
  # the dashboard and is the trigger for a PUT trade recommendation below.
  breakdown_setup:
    enabled: true
    alpha_score_threshold: 88
    require_bearish_direction: true
    require_confirmed_breakout: true
    cooldown_minutes: 60

  # Third alert tier: emails the exact recommended option contract (see
  # scoring.options_strategy above) whenever one is found for a ticker
  # that just qualified for buy_setup or breakdown_setup. Longer cooldown
  # than the technical tiers since a specific contract pick doesn't change
  # as fast as a raw score.
  options_trade:
    enabled: true
    cooldown_minutes: 240

  email:
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    from_address: "you@gmail.com"
    app_password: "CHANGE_ME"
    to_address: "you@gmail.com"

# Keyword tags used to classify news headlines. Informational only - not
# part of the numeric alpha score.
news_tags:
  earnings: ["earnings", "eps", "quarterly results", "guidance", "revenue"]
  fda_clinical: ["fda", "clinical trial", "phase 1", "phase 2", "phase 3", "approval"]
  upgrade_downgrade: ["upgrade", "downgrade", "price target", "initiates coverage", "rating"]
  merger_acquisition: ["acquire", "acquisition", "merger", "buyout", "takeover"]
  insider: ["insider buying", "insider selling", "13d", "13g", "form 4"]
  partnership: ["partnership", "collaboration", "licensing deal", "joint venture"]
  litigation: ["lawsuit", "investigation", "sec probe", "class action"]
  macro: ["fed", "rate decision", "cpi", "jobs report", "inflation"]
